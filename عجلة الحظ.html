<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة الحظ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #fff;
    overflow-x: hidden;
    background: #1c0836;
    background-image:
      radial-gradient(55% 45% at 12% 10%, rgba(224,32,168,0.28), transparent 60%),
      radial-gradient(45% 55% at 90% 15%, rgba(144,56,192,0.30), transparent 60%),
      radial-gradient(60% 50% at 85% 85%, rgba(240,192,64,0.14), transparent 55%),
      radial-gradient(50% 60% at 8% 90%, rgba(227,70,144,0.22), transparent 55%),
      radial-gradient(40% 40% at 50% 50%, rgba(168,56,200,0.15), transparent 60%),
      linear-gradient(160deg, #220a44, #3a1160 40%, #4a1468 70%, #33105c);
    background-attachment: fixed;
  }
  .bg-anim {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: inherit;
  }
  .bg-anim::before, .bg-anim::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(70px); opacity: 0.55; pointer-events: none;
  }
  .bg-anim::before {
    width: 420px; height: 420px; left: -80px; top: -60px;
    background: radial-gradient(circle, rgba(224,32,168,0.75), transparent 70%);
    animation: drift-one 18s ease-in-out infinite alternate;
  }
  .bg-anim::after {
    width: 480px; height: 480px; right: -100px; bottom: -80px;
    background: radial-gradient(circle, rgba(144,56,192,0.8), transparent 70%);
    animation: drift-two 22s ease-in-out infinite alternate;
  }
  @keyframes drift-one {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(90px, 70px) scale(1.15); }
    100% { transform: translate(-40px, 110px) scale(0.95); }
  }
  @keyframes drift-two {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-110px, -90px) scale(1.1); }
    100% { transform: translate(60px, -40px) scale(1.2); }
  }
  .bg-anim .spark {
    position: absolute; border-radius: 50%;
    background: #fff; opacity: 0;
    animation: twinkle var(--tw, 4s) ease-in-out infinite;
    animation-delay: var(--td, 0s);
  }
  .bg-anim .spark.gold { background: #f0c040; box-shadow: 0 0 8px #f0c040; }
  .bg-anim .spark.pink { background: #e020a8; box-shadow: 0 0 8px #e020a8; }
  .bg-anim .spark.violet { background: #9038c0; box-shadow: 0 0 8px #9038c0; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 0.95; transform: scale(1); }
  }
  .bg-anim .ring {
    position: absolute; border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(240,192,64,0.14);
    animation: ring-pulse 9s ease-in-out infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.25); opacity: 0.15; }
  }
  .container {
    width: 100%;
    max-width: 940px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 26px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    backdrop-filter: blur(16px);
    box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
  }
.wheel-box { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .wheel-wrap { position: relative; width: 340px; height: 340px; }
  .wheel-wrap::before {
    content: ''; position: absolute; inset: -22px; border-radius: 50%;
    background: conic-gradient(from 0deg, #c838c0, #e020a8, #f0c040, #9038c0, #c838c0);
    z-index: -1; filter: blur(22px); opacity: 0.35;
    transition: opacity .5s;
    animation: halo-pulse 4s ease-in-out infinite alternate;
  }
  .wheel-wrap.glowing::before { opacity: 0.8; animation: halo-spin 1.1s linear infinite; }
  @keyframes halo-pulse { from { opacity: .28; } to { opacity: .5; } }
  @keyframes halo-spin { to { transform: rotate(360deg); } }
  .wheel-wrap::after {
    content: ''; position: absolute; inset: 9%;
    border-radius: 50%; pointer-events: none; z-index: 4;
    background: radial-gradient(circle at 30% 26%, rgba(255,255,255,0.22), transparent 55%);
  }
  @media (max-width: 430px) { .wheel-wrap { width: 280px; height: 280px; } }
  canvas {
    width: 100%; height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 0 8px rgba(255,255,255,0.06), 0 0 46px rgba(112,48,192,0.5);
    background: #1c0d3a;
  }
  .pointer {
    position: absolute; top: -16px; left: 50%;
    transform: translateX(-50%);
    width: 48px; height: 58px; z-index: 7;
    background: linear-gradient(180deg, #fff3b0, #f0c040 45%, #b8860b);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5));
  }
  .pointer::before {
    content: ''; position: absolute; top: 4px; left: 10px;
    width: 6px; height: 30px; border-radius: 4px;
    background: rgba(255,255,255,0.65);
    transform: rotate(-8deg);
  }
  .pointer .tip {
    position: absolute; bottom: 6px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6cf, #c89a1b);
    box-shadow: 0 0 10px rgba(240,192,64,0.9);
  }
  .center-dot {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 52px; height: 52px; z-index: 6;
    background: radial-gradient(circle at 32% 28%, #fff7cf, #f0c040 42%, #b8860b 85%);
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 22px rgba(224,32,168,0.85), inset 0 -5px 10px rgba(0,0,0,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #7a580f;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    user-select: none;
  }
  .btn-spin {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #f0c040, #e020a8 55%, #9038c0);
    color: #fff; border: none;
    font-size: 21px; font-weight: 800;
    padding: 15px 54px; border-radius: 50px;
    cursor: pointer; letter-spacing: .5px;
    box-shadow: 0 10px 30px rgba(224,32,168,0.5), inset 0 2px 0 rgba(255,255,255,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-spin::after {
    content: ''; position: absolute; top: 0; left: -80%; width: 45%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { left: -90%; } 100% { left: 140%; } }
  .btn-spin:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 38px rgba(224,32,168,0.65), inset 0 2px 0 rgba(255,255,255,0.4); }
  .btn-spin:disabled { opacity: .5; cursor: not-allowed; transform: none; filter: grayscale(.4); }
  .btn-spin:disabled::after { animation: none; }
  .winner {
    min-height: 54px; font-size: 24px; font-weight: 800;
    text-align: center; padding: 12px 22px;
    border-radius: 16px;
    display: none;
    color: #f0c040;
    text-shadow: 0 0 18px rgba(224,32,168,0.65);
  }
  .winner.show {
    display: block;
    animation: pop .6s cubic-bezier(.18, 1.6, .4, 1);
    background: linear-gradient(135deg, rgba(240,192,64,.14), rgba(227,70,144,.12));
    border: 1px solid rgba(240,192,64,.45);
    box-shadow: 0 0 26px rgba(224,32,168,.35), inset 0 0 18px rgba(240,192,64,.08);
  }
  @keyframes pop {
    0% { transform: scale(.4) rotate(-4deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(2deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .panel {
    flex: 1; min-width: 320px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel h2 {
    font-size: 23px; font-weight: 900; text-align: center;
    background: linear-gradient(135deg, #f0c040, #e020a8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: .5px;
  }
  .input-row { display: flex; gap: 10px; }
  .input-row textarea {
    flex: 1; padding: 12px 16px; border: 1.5px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    background: rgba(255,255,255,0.08); color: #fff;
    font-size: 16px; outline: none; direction: rtl;
    resize: vertical; min-height: 64px; max-height: 140px;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    transition: border-color .2s, background .2s;
  }
  .input-row textarea:focus { border-color: rgba(224,32,168,.55); background: rgba(255,255,255,0.11); }
  .input-row textarea::placeholder { color: rgba(255,255,255,0.45); }
  .input-row .btn-add {
    background: linear-gradient(135deg, #f0c040, #e020a8);
    color: #fff; border: none;
    width: 68px; border-radius: 14px; font-size: 16px;
    font-weight: 800; cursor: pointer; align-self: stretch;
    transition: transform .15s, box-shadow .15s;
    word-spacing: 2px; line-height: 1.5;
    box-shadow: 0 6px 16px rgba(224,32,168,0.35);
  }
  .btn-add:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 24px rgba(224,32,168,0.5); }
  .list {
    list-style: none; max-height: 250px; overflow-y: auto;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 8px;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: rgba(224,32,168,0.45); border-radius: 6px; }
  .list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 7px 12px; margin: 4px 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    font-size: 16px;
    animation: slideIn .3s cubic-bezier(.2, 1.2, .4, 1);
    transition: background .15s, transform .15s;
  }
  .list li:hover { background: rgba(255,255,255,0.12); transform: translateX(-4px); }
  .list li .badge {
    flex: none; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: linear-gradient(135deg, #f0c040, #e020a8);
    color: #fff; font-weight: 800; font-size: 13px;
  }
  .list li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes slideIn { from { transform: translateX(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .list li .del {
    background: none; border: none; color: #ff8a8a;
    font-size: 19px; cursor: pointer; padding: 0 6px;
    transition: color .15s, transform .15s;
  }
  .list li .del:hover { color: #ff3d3d; transform: scale(1.35); }
  .actions { display: flex; gap: 10px; }
  .btn-sm {
    flex: 1; padding: 11px; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    cursor: pointer; font-size: 15px; font-weight: 700;
    background: rgba(255,255,255,0.08); color: #fff;
    transition: background .15s, transform .15s;
  }
  .btn-sm:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
  .btn-sm:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .empty-msg { text-align: center; color: rgba(255,255,255,0.4); padding: 20px; font-size: 15px; }
  .option {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 11px 15px; border-radius: 14px;
    font-size: 15px; cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .option:hover { background: rgba(255,255,255,0.1); }
  .option input { display: none; }
  .switch {
    flex: none; width: 46px; height: 26px;
    border-radius: 14px; position: relative;
    background: rgba(255,255,255,0.18);
    transition: background .25s;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; right: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    transition: transform .25s;
  }
  input:checked + .switch { background: linear-gradient(135deg, #f0c040, #e020a8); }
  input:checked + .switch::after { transform: translateX(-20px); }
  .option .hint { color: #e020a8; font-weight: bold; }
  .logo {
    width: 100%; display: flex; justify-content: center;
    padding-bottom: 4px;
  }
  .logo img {
    max-width: 220px; max-height: 90px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.45));
  }
  .store-bar {
    width: 100%; display: flex; justify-content: center;
    padding-bottom: 8px;
  }
  .store-link {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #f0c040, #e020a8);
    color: #fff; text-decoration: none;
    font-size: 17px; font-weight: 800;
    padding: 9px 24px; border-radius: 50px;
    box-shadow: 0 6px 18px rgba(224,32,168,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .store-link:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 10px 26px rgba(224,32,168,0.6), inset 0 1px 0 rgba(255,255,255,0.35);
  }

  .winner-overlay {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,4,25,0.72);
    backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  .winner-overlay.show { opacity: 1; pointer-events: auto; }
  .winner-card {
    position: relative;
    width: min(460px, 90vw);
    padding: 42px 34px 36px;
    background: linear-gradient(160deg, rgba(60,20,110,0.92), rgba(30,10,60,0.95));
    border: 2px solid rgba(240,192,64,0.5);
    border-radius: 28px;
    box-shadow: 0 0 60px rgba(224,32,168,0.45), 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
    text-align: center;
    transform: scale(0.6) translateY(40px);
    transition: transform .5s cubic-bezier(.2, 1.4, .3, 1);
  }
  .winner-overlay.show .winner-card {
    transform: scale(1) translateY(0);
    animation: card-glow 2s ease-in-out infinite alternate;
  }
  @keyframes card-glow {
    from { box-shadow: 0 0 40px rgba(240,192,64,0.35), 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15); }
    to { box-shadow: 0 0 90px rgba(224,32,168,0.65), 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15); }
  }
  .winner-card .burst {
    position: absolute; top: 50%; left: 50%;
    width: 40px; height: 40px;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(240,192,64,0.9);
    border-radius: 50%;
    opacity: 0;
  }
  .winner-overlay.show .burst { animation: burst-ring 1.1s ease-out forwards; }
  @keyframes burst-ring {
    0% { width: 40px; height: 40px; opacity: 1; }
    100% { width: 460px; height: 460px; opacity: 0; }
  }
  .winner-card .trophy {
    font-size: 72px; line-height: 1;
    filter: drop-shadow(0 6px 16px rgba(240,192,64,0.7));
    animation: trophy-bounce 1.1s cubic-bezier(.3, 1.6, .4, 1) both, trophy-float 2.4s ease-in-out .9s infinite alternate;
  }
  @keyframes trophy-bounce {
    0% { transform: scale(0) rotate(-30deg); }
    55% { transform: scale(1.35) rotate(10deg); }
    80% { transform: scale(0.95) rotate(-4deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes trophy-float {
    from { transform: translateY(0); }
    to { transform: translateY(-9px); }
  }
  .wo-label {
    margin-top: 12px;
    font-size: 17px; font-weight: 700;
    color: rgba(255,255,255,0.75);
    letter-spacing: 2px;
  }
  .wo-name {
    margin: 6px 0 4px;
    font-size: clamp(38px, 9vw, 58px);
    font-weight: 900;
    background: linear-gradient(135deg, #f0c040 0%, #fff7cf 25%, #e020a8 55%, #f0c040 80%, #fff7cf 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: name-shine 2.4s linear infinite;
    word-break: break-word;
  }
  @keyframes name-shine {
    from { background-position: 0% center; }
    to { background-position: -220% center; }
  }
  .wo-sub {
    margin-bottom: 18px;
    font-size: 15px; font-weight: 600;
    color: rgba(255,255,255,0.6);
  }
  .wo-close {
    background: linear-gradient(135deg, #f0c040, #e020a8);
    color: #fff; border: none;
    font-size: 17px; font-weight: 800;
    padding: 12px 42px; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(224,32,168,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform .15s, box-shadow .15s;
  }
  .wo-close:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 30px rgba(224,32,168,0.7); }
</style>
</head>

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
let noiseBuffer = null;
function getNoiseBuffer(secs) {
  const a = getAudio();
  if (!noiseBuffer) {
    noiseBuffer = a.createBuffer(1, Math.floor(a.sampleRate * secs), a.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuffer;
}

const confettiCanvas = document.createElement('canvas');
document.body.appendChild(confettiCanvas);
const cctx = confettiCanvas.getContext('2d');
confettiCanvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;display:none;';
let confettiRaf = null;

function launchConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  confettiCanvas.style.display = 'block';
  const colors = ['#f0c040','#e020a8','#9038c0','#e34690','#c838c0','#f09060','#a038c0','#e04890','#fff','#f0b040'];
  const pieces = [];
  for (let i = 0; i < 180; i++) {
    pieces.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 300,
      w: 6 + Math.random() * 8,
      h: 8 + Math.random() * 12,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 6,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      sway: Math.random() * 0.2 - 0.1
    });
  }
  const start = performance.now();
  cancelAnimationFrame(confettiRaf);

  function frame(now) {
    const elapsed = (now - start) / 1000;
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    for (const p of pieces) {
      p.vy += 0.015;
      p.x += p.vx + Math.sin(elapsed * 3 + p.rot) * 0.8;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y < confettiCanvas.height + 30) {
        alive = true;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
      }
    }
    if (alive && elapsed < 6) {
      confettiRaf = requestAnimationFrame(frame);
    } else {
      confettiCanvas.style.display = 'none';
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }
  confettiRaf = requestAnimationFrame(frame);
}

function modDeg(x) { return ((x % 360) + 360) % 360; }

function shade(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawOuterRing() {
  const TAU = Math.PI * 2;
  const ringOut = radius;
  const ringIn = radius - 30;

  const ring = ctx.createLinearGradient(-radius, -radius, radius, radius);
  ring.addColorStop(0, '#f5d97c');
  ring.addColorStop(0.35, '#e0b050');
  ring.addColorStop(0.65, '#c08040');
  ring.addColorStop(1, '#e6c05c');
  ctx.beginPath();
  ctx.arc(0, 0, ringOut, 0, TAU);
  ctx.arc(0, 0, ringIn, 0, TAU, true);
  ctx.fillStyle = ring;
  ctx.fill();

  const bulbCount = 36;
  const bulbR = (ringOut + ringIn) / 2;
  const bulbSize = 5.5;
  for (let i = 0; i < bulbCount; i++) {
    const a = (i / bulbCount) * TAU;
    const bx = Math.cos(a) * bulbR;
    const by = Math.sin(a) * bulbR;
    const lit = i % 2 === 0;
    ctx.beginPath();
    ctx.arc(bx, by, bulbSize, 0, TAU);
    ctx.fillStyle = lit ? '#fff6cf' : '#5c3c0d';
    ctx.fill();
    if (lit) {
      ctx.beginPath();
      ctx.arc(bx, by, bulbSize + 2.5, 0, TAU);
      ctx.fillStyle = 'rgba(255,240,190,0.30)';
      ctx.fill();
    }
  }

  ctx.beginPath();
  ctx.arc(0, 0, ringIn + 3, 0, TAU);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function draw() {
  const n = names.length;
  ctx.clearRect(0, 0, size, size);
  if (n === 0) {
    ctx.save();
    ctx.translate(cx, cy);
    drawOuterRing();
    ctx.beginPath();
    ctx.arc(0, 0, radius - 30, 0, Math.PI * 2);
    ctx.fillStyle = '#2a1150';
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = 'bold 26px "Segoe UI", Tahoma, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('لا يوجد أسماء', 0, 0);
    ctx.restore();
    return;
  }
  const arc = (Math.PI * 2) / n;
  const segR = radius - 36;
  ctx.save();
  ctx.translate(cx, cy);
  drawOuterRing();

  for (let i = 0; i < n; i++) {
    const start = i * arc;
    const color = palette[i % palette.length];
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, segR, start, start + arc);
    ctx.closePath();
    const grad = ctx.createRadialGradient(0, 0, segR * 0.15, 0, 0, segR);
    grad.addColorStop(0, shade(color, 0.55));
    grad.addColorStop(0.55, color);
    grad.addColorStop(1, shade(color, -0.35));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(0, 0, segR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px "Segoe UI", Tahoma, Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const mid = i * arc + arc / 2;
    ctx.save();
    ctx.rotate(mid);
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 1;
    ctx.fillText(names[i], segR - 16, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(0, 0, 34, 0, Math.PI * 2);
  ctx.fillStyle = '#1f0d3f';
  ctx.fill();
  ctx.restore();
  canvas.style.transform = 'rotate(' + rotation + 'deg)';
}

function splitNames(text) {
  return text.split(/[\n,;،؛\/]/).map(s => s.trim()).filter(Boolean);
}

function addName() {
  const input = document.getElementById('nameInput');
  const parts = splitNames(input.value);
  if (parts.length === 0) return;
  let added = 0;
  for (const part of parts) {
    if (part.length > 40) continue;
    if (!names.includes(part)) {
      names.push(part);
      added++;
    }
  }
  input.value = '';
  input.focus();
  if (added > 0) saveNames();
  render();
}

function render() {
  renderList();
  draw();
  const btn = document.getElementById('btnClear');
  btn.disabled = names.length === 0;
  if (names.length === 0) document.getElementById('winner').className = 'winner';
}

function renderList() {
  const list = document.getElementById('nameList');
  list.innerHTML = '';
  if (names.length === 0) {
    list.innerHTML = '<div class="empty-msg">أضف أسماء المشاركين لتبدأ السحب</div>';
    return;
  }
  names.forEach((name, idx) => {
    const li = document.createElement('li');
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = idx + 1;
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = name;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = 'حذف';
    del.onclick = () => { names.splice(idx, 1); saveNames(); render(); };
    li.appendChild(badge);
    li.appendChild(nm);
    li.appendChild(del);
    list.appendChild(li);
  });
}

function spin() {
  if (spinning) return;
  if (names.length === 0) {
    document.getElementById('winner').textContent = 'أضف أسماء أولًا!';
    document.getElementById('winner').className = 'winner show';
    return;
  }
  if (eliminationMode && names.length === 1) {
    document.getElementById('winner').textContent = '🏆 الفائز النهائي: ' + names[0];
    document.getElementById('winner').className = 'winner show';
    celebrate(names[0], 'الفائز النهائي 🎉');
    return;
  }
spinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('winner').className = 'winner';
  document.getElementById('wheelWrap').classList.add('glowing');
  playWhoosh();

  const n = names.length;
  const arcDeg = 360 / n;
  const targetIdx = Math.floor(Math.random() * n);
  const fullTurns = 5 + Math.floor(Math.random() * 4);
  const jitter = Math.random() * arcDeg * 0.9;

  const targetMod = modDeg(270 - (targetIdx + 0.5) * arcDeg + jitter);
  const targetRotation = rotation + fullTurns * 360 + modDeg(targetMod - modDeg(rotation));

const startRotation = rotation;
  const diff = targetRotation - rotation;
  const duration = 4000;
  const startTime = performance.now();

  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    rotation = startRotation + diff * ease;
    canvas.style.transform = 'rotate(' + rotation + 'deg)';

    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      finish(targetIdx);
    }
  }
  requestAnimationFrame(step);
}

function finish(targetIdx) {
  const winnerEl = document.getElementById('winner');
  const name = names[targetIdx];

if (eliminationMode && names.length > 1) {
    winnerEl.textContent = '❌ الخاسر: ' + name + ' — حُذف من السحب';
    winnerEl.className = 'winner show';
    playLose();
    names.splice(targetIdx, 1);
    saveNames();
    render();
    spinning = false;
    document.getElementById('btnSpin').disabled = false;
    document.getElementById('wheelWrap').classList.remove('glowing');
    if (names.length === 1) {
      setTimeout(() => {
        winnerEl.textContent = '🏆 الفائز النهائي: ' + names[0];
        winnerEl.className = 'winner show';
        celebrate(names[0], 'الفائز النهائي 🎉');
      }, 1500);
    }
    return;
  }

winnerEl.textContent = '🏆 الفائز: ' + name;
  winnerEl.className = 'winner show';
  spinning = false;
  document.getElementById('btnSpin').disabled = false;
  document.getElementById('wheelWrap').classList.remove('glowing');
  celebrate(name, 'الفائز بالسحب 🎉');
}

document.getElementById('btnAdd').onclick = addName;
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addName();
});
document.getElementById('btnSpin').onclick = spin;
document.getElementById('elimMode').addEventListener('change', (e) => {
  eliminationMode = e.target.checked;
});
document.getElementById('soundToggle').addEventListener('change', (e) => {
  soundOn = e.target.checked;
});
document.getElementById('btnClear').onclick = () => {
  names.length = 0;
  rotation = 0;
  saveNames();
  render();
};
document.getElementById('btnSort').onclick = () => {
  names.sort(() => Math.random() - 0.5);
  saveNames();
  render();
};

render();
</script>
</body>
</html>
